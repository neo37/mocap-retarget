<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Захват движения → любая модель</title>
<style>
  :root {
    --bg:#0b0b0c; --panel:#151517; --sunk:#0f0f11; --ink:#f4f4ef; --muted:#8f8f88;
    --line:#f4f4ef; --acid:#d8ff36; --hot:#ff4d17; --sky:#4dd0ff; --violet:#c4a6ff;
    --edge:#2b2b30;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  }
  h1,h2,h3 { margin:0; text-transform:uppercase; letter-spacing:.04em; font-weight:900; }
  h1 { font-size:20px; }
  h2 { font-size:13px; color:var(--muted); }
  h3 { font-size:15px; }
  a { color:var(--acid); }
  .mono { font-family:ui-monospace, "JetBrains Mono", Menlo, monospace; }
  .muted { color:var(--muted); }
  .pad { padding:16px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .col { display:flex; flex-direction:column; gap:14px; }
  .grow { flex:1; }

  header.top {
    position:sticky; top:0; z-index:6; background:var(--bg);
    border-bottom:3px solid var(--line); padding:12px 18px;
    display:flex; gap:16px; align-items:center;
  }
  .brand { font-weight:900; font-size:17px; text-transform:uppercase; letter-spacing:.06em; }
  .brand span { background:var(--acid); color:#0b0b0c; padding:3px 8px; }
  .crumbs { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted);
            text-transform:uppercase; letter-spacing:.06em; }
  .crumbs a { color:var(--muted); text-decoration:none; border-bottom:2px solid var(--edge); }
  .crumbs a:hover { color:var(--ink); border-color:var(--acid); }

  main { padding:18px; max-width:1500px; margin:0 auto; }
  .panel { background:var(--panel); border:3px solid var(--line); box-shadow:6px 6px 0 #000; }
  .panel > header { border-bottom:3px solid var(--line); padding:10px 14px;
                    display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .panel > .body { padding:14px; }

  button, .btn {
    font:inherit; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    background:var(--panel); color:var(--ink); border:3px solid var(--line); padding:9px 13px;
    cursor:pointer; box-shadow:4px 4px 0 #000; transition:transform .06s, box-shadow .06s;
  }
  button:hover:not(:disabled) { transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--acid); }
  button:active:not(:disabled) { transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--acid); color:#0b0b0c; border-color:#0b0b0c; box-shadow:4px 4px 0 var(--ink); }
  button.hot { background:var(--hot); color:#0b0b0c; border-color:#0b0b0c; box-shadow:4px 4px 0 var(--ink); }
  button.ghost { box-shadow:none; border-width:2px; padding:6px 9px; }
  a.btn { display:inline-block; text-decoration:none; }
  button.on { background:var(--sky); color:#0b0b0c; border-color:#0b0b0c; }

  input, select, textarea {
    font:inherit; background:var(--sunk); color:var(--ink); border:3px solid var(--line);
    padding:8px 10px; width:100%;
  }
  input:focus, select:focus { outline:3px solid var(--acid); outline-offset:-3px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
          color:var(--muted); margin:0 0 5px; font-weight:800; }
  .field { min-width:90px; }

  .drop { border:3px dashed var(--edge); background:var(--sunk); padding:18px; text-align:center;
          cursor:pointer; color:var(--muted); font-weight:700; text-transform:uppercase;
          letter-spacing:.05em; font-size:12px; }
  .drop:hover, .drop.over { border-color:var(--acid); color:var(--ink); }

  .tag { display:inline-block; font-size:11px; font-weight:900; text-transform:uppercase;
         letter-spacing:.06em; padding:3px 7px; border:2px solid var(--line); }
  .tag.acid { background:var(--acid); color:#0b0b0c; border-color:#0b0b0c; }
  .tag.hot  { background:var(--hot); color:#0b0b0c; border-color:#0b0b0c; }
  .tag.sky  { background:var(--sky); color:#0b0b0c; border-color:#0b0b0c; }
  .tag.violet { background:var(--violet); color:#0b0b0c; border-color:#0b0b0c; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:18px; }
  .card { background:var(--panel); border:3px solid var(--line); box-shadow:6px 6px 0 var(--acid);
          padding:14px; display:flex; flex-direction:column; gap:10px; }
  .card:hover { box-shadow:8px 8px 0 var(--acid); }
  .card .name { font-weight:900; font-size:16px; }
  .card, .list .item .who div { overflow-wrap:anywhere; }

  .split { display:grid; grid-template-columns:minmax(330px, 400px) 1fr; gap:18px; align-items:start; }
  @media (max-width: 1050px) { .split { grid-template-columns:1fr; } }

  .list { display:flex; flex-direction:column; }
  .list .item { display:flex; gap:10px; align-items:center; padding:9px 12px;
                border-bottom:2px solid var(--edge); cursor:pointer; }
  .list .item:last-child { border-bottom:0; }
  .list .item.on { background:#20200f; box-shadow:inset 4px 0 0 var(--acid); }
  .list .item .who { flex:1; min-width:0; }
  .list .item .who div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .frames { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; }
  .frame { position:relative; flex:0 0 auto; border:3px solid var(--edge); cursor:pointer; line-height:0; }
  .frame img { width:124px; display:block; }
  .frame.on { border-color:var(--acid); }
  .frame.on::after { content:'✔'; position:absolute; right:3px; top:3px; background:var(--acid);
                     color:#0b0b0c; font-size:12px; font-weight:900; padding:1px 5px; }
  .frame .t { position:absolute; left:0; bottom:0; background:#0b0b0c; color:var(--acid);
              font:11px/1 ui-monospace, monospace; padding:3px 5px; }

  #stage { height:min(62vh, 620px); background:var(--sunk); border-bottom:3px solid var(--line); }
  #stage canvas { display:block; width:100%; height:100%; }

  .bar { height:10px; background:var(--sunk); border:3px solid var(--line); }
  .bar span { display:block; height:100%; background:var(--acid); width:0; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:2px solid var(--edge); }
  th { font-size:11px; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; }

  .toast { position:fixed; right:18px; bottom:18px; z-index:20; display:flex; flex-direction:column; gap:8px; }
  .toast div { background:var(--acid); color:#0b0b0c; border:3px solid #0b0b0c;
               box-shadow:5px 5px 0 var(--ink); padding:10px 14px; font-weight:800;
               text-transform:uppercase; letter-spacing:.04em; font-size:12px; max-width:420px; }
  .toast div.err { background:var(--hot); }
  footer.foot { padding:18px; color:var(--muted); font-size:12px; text-transform:uppercase;
                letter-spacing:.06em; border-top:3px solid var(--edge); margin-top:24px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">MOCAP <span>RETARGET</span></div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="grow"></div>
  <div class="crumbs mono" id="health"></div>
</header>
<main id="app"></main>
<footer class="foot">videos.ai3d.art/nella — видео и фото → поза и анимация на вашей модели</footer>
<div class="toast" id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
